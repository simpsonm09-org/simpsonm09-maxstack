name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org'
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/lint.yml@5da707371e38c6391df83d13b487a01253379457 # repo-standard 5da7073
  aislop:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/aislop.yml@5da707371e38c6391df83d13b487a01253379457 # repo-standard 5da7073
  security:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/security.yml@5da707371e38c6391df83d13b487a01253379457 # repo-standard 5da7073
  standard:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/standard.yml@5da707371e38c6391df83d13b487a01253379457 # repo-standard 5da7073

  test:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the workspace manifests
        run: python3 scripts/verify-manifests.py

  # The installer suite is split across four Windows runners; each shard drives Install-Workspace.ps1
  # under PowerShell 7 and compares against upstream main. fetch-depth 0 provides that commit.
  test-node-shard:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Print the runner facts the suite depends on
        shell: bash
        run: |
          git --version
          node --version
          pwsh --version
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "os.tmpdir()=$(node -p "require('os').tmpdir()")"
          echo "global safe.directory entries:"
          git config --global --get-all safe.directory || echo "  (none)"
      - name: Run node test shard ${{ matrix.shard }} of 4
        # The default temp path is an 8.3 short name; the installer reports the long form, so the tests need a temp folder without one.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: just test-node-shard ${{ matrix.shard }} 4

  test-node:
    if: always() && github.repository_owner == 'simpsonm09-org'
    runs-on: ubuntu-24.04
    needs: [test-node-shard]
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every node test shard to succeed
        env:
          SHARDS_RESULT: ${{ needs.test-node-shard.result }}
        run: test "$SHARDS_RESULT" = success

  # Informational portability signals only; neither job is part of the required test-node aggregate.
  test-macos:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Ensure PowerShell 7 is available
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            brew install powershell
          fi
          pwsh --version
      - name: Print runner tools
        run: |
          node --version
          python3 --version
          git --version
      - name: Run focused macOS checks
        run: just test-macos

  test-linux:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Verify PowerShell 7
        run: pwsh --version
      - name: Print runner tools
        run: |
          node --version
          python3 --version
          git --version
      - name: Run focused POSIX checks
        run: just test-posix
