name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org'
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/lint.yml@a9bbf9e582c0117df8cdebd50c7dc5239c472c92 # repo-standard, pinned commit
  aislop:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/aislop.yml@a9bbf9e582c0117df8cdebd50c7dc5239c472c92 # repo-standard, pinned commit
  security:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/security.yml@a9bbf9e582c0117df8cdebd50c7dc5239c472c92 # repo-standard, pinned commit
  standard:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/standard.yml@a9bbf9e582c0117df8cdebd50c7dc5239c472c92 # repo-standard, pinned commit

  test:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the workspace manifests
        run: python3 scripts/verify-manifests.py

  # The installer tests run on Windows: they drive Install-Workspace.ps1 under PowerShell 7 and
  # Windows paths. fetch-depth 0 keeps the upstream main commit that a test compares with.
  test-node:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: windows-latest
    # Expected about 20 to 25 minutes: the installer suite is six Install-Workspace.*.test.mjs files, run four at a time.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Print the runner facts the suite depends on
        shell: bash
        run: |
          git --version
          node --version
          pwsh --version
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "os.tmpdir()=$(node -p "require('os').tmpdir()")"
          echo "global safe.directory entries:"
          git config --global --get-all safe.directory || echo "  (none)"
      - name: Run the node test suite
        # The default temp path is an 8.3 short name; the installer reports the long form, so the tests need a temp folder without one.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: just test-node
